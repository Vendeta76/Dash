<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iRacing Head Tracker V0.3</title><style>*{box-sizing:border-box}body{margin:0;background:#05070a;color:#fff;font-family:Arial,sans-serif}main{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.title{font-size:24px;font-weight:800}.status{font-size:14px;color:#8cff9a}button{padding:12px 20px;border:0;border-radius:9px;background:#ff8a00;color:#000;font-weight:800;font-size:16px;cursor:pointer}.preview{margin-top:14px;background:#10151c;border-radius:14px;overflow:hidden}video{display:block;width:100%;max-height:650px;object-fit:contain;background:#000}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.card{background:#11161d;border-radius:12px;padding:14px;text-align:center}.label{font-size:12px;color:#8e9aaa}.value{font-size:32px;font-weight:800;margin-top:4px}.info{margin-top:14px;background:#11161d;border-radius:12px;padding:12px;color:#aab3bf;font-size:13px}.bad{color:#ff7070}</style></head><body><main><div class="top"><div class="title">iRacing Head Tracker</div><div id="status" class="status">DETENIDO</div></div><button id="start">INICIAR WEBCAM</button><div class="preview"><video id="video" width="640" height="480" autoplay playsinline muted></video></div><div class="grid"><div class="card"><div class="label">YAW</div><div class="value" id="yaw">0.0°</div></div><div class="card"><div class="label">PITCH</div><div class="value" id="pitch">0.0°</div></div><div class="card"><div class="label">ROLL</div><div class="value" id="roll">0.0°</div></div></div><div id="info" class="info">V0.3 · Webcam PC · preparado para OpenTrack</div></main><script src="https://cdn.jsdelivr.net/npm/clmtrackr@1.1.1/build/clmtrackr.min.js"></script><script src="./model_pca_20_svm.js"></script><script>const video=document.getElementById('video'),statusEl=document.getElementById('status'),info=document.getElementById('info'),yawEl=document.getElementById('yaw'),pitchEl=document.getElementById('pitch'),rollEl=document.getElementById('roll');let tracker=null,stream=null,running=false;async function start(){try{if(!window.pModel)throw new Error('MODELO FACIAL NO CARGADO');if(!navigator.mediaDevices?.getUserMedia)throw new Error('WEBCAM NO DISPONIBLE');stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false});video.srcObject=stream;await new Promise(resolve=>{if(video.readyState>=2)resolve();else video.onloadeddata=resolve});await video.play();tracker=new clm.tracker();tracker.init(window.pModel);tracker.start(video);running=true;statusEl.textContent='TRACKING ACTIVO';document.getElementById('start').style.display='none';loop()}catch(e){statusEl.textContent='ERROR';statusEl.className='status bad';info.textContent=e.name+': '+e.message}}function loop(){if(!running)return;const p=tracker.getCurrentPosition();if(p&&p.length){const nose=p[62]||p[33],left=p[27],right=p[32],top=p[41],bottom=p[7],midx=(left[0]+right[0])/2,midy=(left[1]+right[1])/2,faceW=Math.max(1,Math.abs(right[0]-left[0])),faceH=Math.max(1,Math.abs(bottom[1]-top[1])),yaw=((nose[0]-midx)/faceW)*70,pitch=((nose[1]-midy)/faceH)*55,roll=Math.atan2(right[1]-left[1],right[0]-left[0])*180/Math.PI;yawEl.textContent=yaw.toFixed(1)+'°';pitchEl.textContent=pitch.toFixed(1)+'°';rollEl.textContent=roll.toFixed(1)+'°';info.textContent='CARA DETECTADA · Webcam PC · tracking activo'}else info.textContent='BUSCANDO CARA · coloca la cara frente a la webcam';requestAnimationFrame(loop)}document.getElementById('start').onclick=start;</script></body></html>
