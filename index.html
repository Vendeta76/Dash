<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>iRacing Mobile Dash V0.1</title><style>body{margin:0;background:#05070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden}main{height:100vh;display:flex;flex-direction:column;justify-content:center;padding:18px;box-sizing:border-box}button{padding:14px;border:0;border-radius:12px;background:#ff8a00;color:#000;font-weight:800;font-size:18px}#video{width:1px;height:1px;opacity:.01;position:absolute}#status{margin:12px 0;text-align:center;font-size:14px;color:#8cff9a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#11161d;border-radius:14px;padding:14px;text-align:center}.label{font-size:12px;color:#8e9aaa}.value{font-size:30px;font-weight:800;margin-top:4px}.dash{margin-top:12px}.hint{text-align:center;color:#777;font-size:12px;margin-top:12px}</style></head><body><main><div id="status">CÁMARA DETENIDA</div><button id="start">INICIAR CÁMARA</button><video id="video" autoplay playsinline muted></video><div class="dash grid"><div class="card"><div class="label">YAW</div><div class="value" id="yaw">--</div></div><div class="card"><div class="label">PITCH</div><div class="value" id="pitch">--</div></div><div class="card"><div class="label">ROLL</div><div class="value" id="roll">--</div></div><div class="card"><div class="label">TRACKING</div><div class="value" id="track">TEST</div></div></div><div class="hint">V0.1 · iPhone 7 · prueba de cámara</div></main><script>const v=document.getElementById('video'),s=document.getElementById('status');document.getElementById('start').onclick=async()=>{try{v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});s.textContent='CÁMARA ACTIVA';document.getElementById('start').style.display='none';}catch(e){s.textContent='ERROR: '+e.message}};</script></body></html>
