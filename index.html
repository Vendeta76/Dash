<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iRacing Head + Eye Tracker V0.4</title><style>*{box-sizing:border-box}body{margin:0;background:#05070a;color:#fff;font-family:Arial,sans-serif}main{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:24px;font-weight:800}.status{color:#8cff9a}.preview{margin-top:14px;background:#10151c;border-radius:14px;overflow:hidden}video{display:block;width:100%;max-height:620px;object-fit:contain;background:#000}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.card{background:#11161d;border-radius:12px;padding:12px;text-align:center}.label{font-size:11px;color:#8e9aaa}.value{font-size:26px;font-weight:800;margin-top:4px}.section{margin-top:12px;color:#aab3bf;font-size:13px}.out{font-size:30px;color:#ff9b22}.info{margin-top:12px;background:#11161d;border-radius:12px;padding:12px;font-size:13px;color:#aab3bf}</style></head><body><main><div class="top"><div class="title">iRacing Head + Eye Tracker</div><div id="status" class="status">DETENIDO</div></div><button id="start">INICIAR WEBCAM</button><div class="preview"><video id="video" width="640" height="480" autoplay playsinline muted></video></div><div class="section">CABEZA</div><div class="grid"><div class="card"><div class="label">HEAD YAW</div><div class="value" id="hy">0.0°</div></div><div class="card"><div class="label">HEAD PITCH</div><div class="value" id="hp">0.0°</div></div><div class="card"><div class="label">HEAD ROLL</div><div class="value" id="hr">0.0°</div></div></div><div class="section">OJOS</div><div class="grid"><div class="card"><div class="label">EYE X</div><div class="value" id="ex">0.00</div></div><div class="card"><div class="label">EYE Y</div><div class="value" id="ey">0.00</div></div><div class="card"><div class="label">MIRADA</div><div class="value" id="gaze">CENTRO</div></div></div><div class="section">SALIDA COMBINADA</div><div class="grid"><div class="card"><div class="label">OUTPUT YAW</div><div class="value out" id="oy">0.0°</div></div><div class="card"><div class="label">OUTPUT PITCH</div><div class="value out" id="op">0.0°</div></div><div class="card"><div class="label">OUTPUT ROLL</div><div class="value out" id="or">0.0°</div></div></div><div id="info" class="info">V0.4 · cabeza + ojos · salida combinada · sin OpenTrack todavía</div></main><script src="https://cdn.jsdelivr.net/npm/clmtrackr@1.1.1/build/clmtrackr.min.js"></script><script src="./model_pca_20_svm.js"></script><script>
const v=document.getElementById('video'),s=document.getElementById('status'),info=document.getElementById('info');const hy=document.getElementById('hy'),hp=document.getElementById('hp'),hr=document.getElementById('hr'),ex=document.getElementById('ex'),ey=document.getElementById('ey'),gaze=document.getElementById('gaze'),oy=document.getElementById('oy'),op=document.getElementById('op'),orx=document.getElementById('or');let t=null,run=false;
async function start(){try{if(!window.pModel)throw Error('MODELO FACIAL NO CARGADO');const st=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false});v.srcObject=st;await new Promise(r=>{if(v.readyState>=2)r();else v.onloadeddata=r});await v.play();t=new clm.tracker();t.init(window.pModel);t.start(v);run=true;s.textContent='TRACKING ACTIVO';document.getElementById('start').style.display='none';loop()}catch(e){s.textContent='ERROR';info.textContent=e.name+': '+e.message}}
function avg(p,a){let x=0,y=0;for(const i of a){x+=p[i][0];y+=p[i][1]}return[x/a.length,y/a.length]}
function loop(){if(!run)return;const p=t.getCurrentPosition();if(p&&p.length){const nose=p[62]||p[33],le=avg(p,[23,24,25,26,27,28]),re=avg(p,[30,31,32,33,34,35]),left=p[27],right=p[32],top=p[41],bottom=p[7],midX=(left[0]+right[0])/2,midY=(left[1]+right[1])/2,w=Math.max(1,Math.abs(right[0]-left[0])),h=Math.max(1,Math.abs(bottom[1]-top[1]));const headYaw=((nose[0]-midX)/w)*70,headPitch=((nose[1]-midY)/h)*55,headRoll=Math.atan2(right[1]-left[1],right[0]-left[0])*180/Math.PI;const eyeLX=(p[27][0]-p[23][0])/Math.max(1,p[28][0]-p[23][0]),eyeRX=(p[32][0]-p[30][0])/Math.max(1,p[35][0]-p[30][0]);const eyeX=((eyeLX+eyeRX)/2-.5)*2;const eyeLY=(p[27][1]-p[24][1])/Math.max(1,p[28][1]-p[24][1]),eyeRY=(p[32][1]-p[31][1])/Math.max(1,p[35][1]-p[30][1]);const eyeY=((eyeLY+eyeRY)/2-.5)*2;const gazeX=Math.max(-1,Math.min(1,eyeX)),gazeY=Math.max(-1,Math.min(1,eyeY));const outYaw=headYaw+gazeX*8,outPitch=headPitch+gazeY*5;hy.textContent=headYaw.toFixed(1)+'°';hp.textContent=headPitch.toFixed(1)+'°';hr.textContent=headRoll.toFixed(1)+'°';ex.textContent=gazeX.toFixed(2);ey.textContent=gazeY.toFixed(2);gaze.textContent=Math.abs(gazeX)<.18&&Math.abs(gazeY)<.18?'CENTRO':(Math.abs(gazeX)>Math.abs(gazeY)?(gazeX>0?'DERECHA':'IZQUIERDA'):(gazeY>0?'ABAJO':'ARRIBA'));oy.textContent=outYaw.toFixed(1)+'°';op.textContent=outPitch.toFixed(1)+'°';orx.textContent=headRoll.toFixed(1)+'°';info.textContent='CARA DETECTADA · cabeza principal + corrección ocular'}requestAnimationFrame(loop)}document.getElementById('start').onclick=start;
</script></body></html>
