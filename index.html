<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>iRacing Mobile Dash V0.2.4</title><style>*{box-sizing:border-box}body{margin:0;background:#05070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden}main{min-height:100vh;padding:12px;display:flex;flex-direction:column;gap:10px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:18px;font-weight:800}.status{font-size:12px;color:#8cff9a}.preview{width:100%;height:250px;background:#10151c;border-radius:14px;overflow:hidden}.preview video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}button{padding:12px 18px;border:0;border-radius:10px;background:#ff8a00;color:#000;font-weight:800;font-size:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{background:#11161d;border-radius:12px;padding:10px;text-align:center}.label{font-size:11px;color:#8e9aaa}.value{font-size:25px;font-weight:800;margin-top:3px}.hint{text-align:center;color:#69717d;font-size:11px}@media(max-height:650px){.preview{height:180px}.value{font-size:22px}}</style></head><body><main><div class="top"><div class="title">iRacing Mobile Dash</div><div id="status" class="status">DETENIDO</div></div><button id="start">INICIAR TRACKING</button><div class="preview"><video id="video" width="400" height="300" autoplay playsinline muted></video></div><div class="grid"><div class="card"><div class="label">YAW</div><div class="value" id="yaw">0.0°</div></div><div class="card"><div class="label">PITCH</div><div class="value" id="pitch">0.0°</div></div><div class="card"><div class="label">ROLL</div><div class="value" id="roll">0.0°</div></div></div><div id="track" class="hint">V0.2.2 · tracking facial · iPhone 7</div></main><script src="https://cdn.jsdelivr.net/npm/clmtrackr@1.1.1/build/clmtrackr.min.js"></script><script src="./model_pca_20_svm.js"></script><script>const video=document.getElementById('video'),statusEl=document.getElementById('status'),trackEl=document.getElementById('track'),yawEl=document.getElementById('yaw'),pitchEl=document.getElementById('pitch'),rollEl=document.getElementById('roll');let tracker,stream,running=false;function angle(a,b,c){const abx=a[0]-b[0],aby=a[1]-b[1],cbx=c[0]-b[0],cby=c[1]-b[1];return Math.atan2(abx*cby-aby*cbx,abx*cbx+aby*cby)*180/Math.PI}async function start(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});video.srcObject=stream;await new Promise(resolve=>{if(video.readyState>=2)resolve();else video.onloadeddata=resolve;});await video.play();tracker=new clm.tracker();if(!window.pModel){throw new Error("MODELO FACIAL NO CARGADO");}tracker.init(window.pModel);tracker.start(video);running=true;statusEl.textContent='TRACKING ACTIVO';document.getElementById('start').style.display='none';loop()}catch(e){statusEl.textContent='ERROR';statusEl.style.color='#ff7070';trackEl.textContent=e.name+': '+e.message}}function loop(){if(!running)return;const p=tracker.getCurrentPosition();if(p&&p.length){const nose=p[62]||p[33],left=p[27],right=p[32],top=p[41],bottom=p[7],midx=(left[0]+right[0])/2,midy=(left[1]+right[1])/2,faceW=Math.max(1,Math.abs(right[0]-left[0]));const yaw=((nose[0]-midx)/faceW)*70,pitch=((nose[1]-midy)/Math.max(1,Math.abs(bottom[1]-top[1])))*55,roll=angle(left,[midx,midy],right);yawEl.textContent=yaw.toFixed(1)+'°';pitchEl.textContent=pitch.toFixed(1)+'°';rollEl.textContent=roll.toFixed(1)+'°';trackEl.textContent='CARA DETECTADA'}else trackEl.textContent='BUSCANDO CARA';requestAnimationFrame(loop)}document.getElementById('start').onclick=start;</script></body></html>
